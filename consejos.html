<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consejos de limpieza — Super Brillo Díaz</title>
<meta name="description" content="Guías de dosificación, orden de aplicación y errores comunes, explicadas por quienes fabrican el producto.">
<link rel="stylesheet" href="assets/css/estilo.css">
</head>
<body>

<main>
	<div class="contenedor">
		<nav class="migas" aria-label="Ruta">
			<a href="index.html">Inicio</a> / <span>Consejos de limpieza</span>
		</nav>
	</div>

	<div class="contenedor encabezado-tienda">
		<h1>Consejos de limpieza</h1>
		<p>
			Dosificación, orden de aplicación y los errores que más vemos en campo.
			Escrito por el equipo que fabrica y despacha el producto, no por un blog genérico.
		</p>
	</div>

	<!-- Listado -->
	<section class="seccion" style="padding-top:10px" id="zona-listado">
		<div class="contenedor">
			<div class="rejilla-consejos" id="rejilla-consejos"></div>
		</div>
	</section>

	<!-- Artículo abierto -->
	<section class="seccion oculto" style="padding-top:10px" id="zona-articulo">
		<div class="contenedor" id="articulo"></div>
	</section>
</main>

<script src="assets/js/datos.js"></script>
<script src="assets/js/app.js"></script>
<script>
	iniciarPagina("consejos.html")

	const $listado = document.getElementById("zona-listado")
	const $zonaArt = document.getElementById("zona-articulo")

	/* ---------------- Listado ---------------- */
	document.getElementById("rejilla-consejos").innerHTML = CONSEJOS.map((c) => {
		const prod = productoPorSlug(c.producto)
		return `
	<article class="tarjeta-consejo">
		<a class="marco-imagen" href="#${c.slug}">
			<img src="${prod ? imagenDe(prod) : ""}" alt="" loading="lazy">
		</a>
		<div class="cuerpo-tarjeta">
			<div class="meta-consejo">
				<span class="cat">${c.categoria}</span><span>·</span><span>${c.minutos} min de lectura</span>
			</div>
			<h3><a href="#${c.slug}" style="color:inherit">${c.titulo}</a></h3>
			<p>${c.extracto}</p>
			<a class="enlace-flecha" href="#${c.slug}">Leer el consejo →</a>
		</div>
	</article>`
	}).join("")

	/* ---------------- Artículo ---------------- */
	function pintarArticulo(slug) {
		const c = CONSEJOS.find((x) => x.slug === slug)
		if (!c) return mostrarListado()

		const prod = productoPorSlug(c.producto)
		const otros = CONSEJOS.filter((x) => x.slug !== slug).slice(0, 3)

		document.getElementById("articulo").innerHTML = `
		<p style="margin-bottom:18px"><a href="#" id="volver">← Volver a todos los consejos</a></p>

		<article style="max-width:74ch">
			<div class="meta-consejo" style="margin-bottom:12px">
				<span class="cat">${c.categoria}</span><span>·</span><span>${c.minutos} min de lectura</span>
			</div>
			<h1 style="margin-bottom:20px">${c.titulo}</h1>
			<p style="font-size:1.1rem;color:var(--tinta-media);border-left:3px solid var(--lima-500);padding-left:16px">
				${c.extracto}
			</p>
			${c.cuerpo.map((p) => `<p>${p}</p>`).join("")}
		</article>

		${
			prod
				? `
		<aside style="max-width:74ch;margin-top:36px;display:grid;grid-template-columns:130px 1fr;gap:20px;align-items:center;background:var(--fondo-alt);border:1px solid var(--linea);border-radius:var(--radio);padding:22px">
			<a class="marco-imagen" href="producto.html?p=${prod.slug}" style="aspect-ratio:1/1;border-radius:var(--radio-sm)">
				<img src="${imagenDe(prod)}" alt="${prod.nombre}">
			</a>
			<div>
				<span class="cat-tarjeta">Producto mencionado</span>
				<h3 style="margin:2px 0 6px"><a href="producto.html?p=${prod.slug}" style="color:inherit">${prod.nombre}</a></h3>
				<p style="font-size:.9rem;color:var(--tinta-media);margin:0 0 12px">${prod.resumen}</p>
				<a class="btn btn-primario btn-mini" href="producto.html?p=${prod.slug}">Ver producto</a>
			</div>
		</aside>`
				: ""
		}

		<div style="max-width:74ch;margin-top:44px">
			<h2 style="font-size:1.3rem">Sigue leyendo</h2>
			<ul style="list-style:none;padding:0;margin:0">
				${otros
					.map(
						(o) => `
				<li style="padding:14px 0;border-bottom:1px solid var(--linea)">
					<a href="#${o.slug}" style="font-weight:700">${o.titulo}</a>
					<div style="font-size:.82rem;color:var(--tinta-suave)">${o.categoria} · ${o.minutos} min</div>
				</li>`,
					)
					.join("")}
			</ul>
		</div>`

		$listado.classList.add("oculto")
		$zonaArt.classList.remove("oculto")
		document.getElementById("volver").addEventListener("click", (e) => {
			e.preventDefault()
			location.hash = ""
			mostrarListado()
		})
		window.scrollTo({ top: 0 })
	}

	function mostrarListado() {
		$zonaArt.classList.add("oculto")
		$listado.classList.remove("oculto")
	}

	function enrutar() {
		const slug = location.hash.replace("#", "")
		if (slug) pintarArticulo(slug)
		else mostrarListado()
	}

	window.addEventListener("hashchange", enrutar)
	enrutar()
</script>
</body>
</html>
